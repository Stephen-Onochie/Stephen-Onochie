<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0705">
<title>Ojis @ 50 — Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Manrope:wght@500;700;800&display=swap">
<style>
  :root{--ink:#0A0705;--ink2:#120D07;--line:#241B10;--line2:#3A2C17;--gold:#D4AF37;--gold-hi:#F7E3A1;
        --gold-dim:#8C6D1F;--cream:#F8F2E4;--muted:#8A8272;--muted2:#6E6252;--ok:#12B76A;--warn:#FDB022;--bad:#F97066}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{background:var(--ink);color:var(--cream);font-family:'Manrope',ui-sans-serif,system-ui,sans-serif;
       padding:env(safe-area-inset-top) 0 calc(28px + env(safe-area-inset-bottom))}
  .wrap{max-width:520px;margin:0 auto;padding:0 20px}
  .top{display:flex;align-items:center;justify-content:space-between;padding:20px 0 14px}
  .wm{font-family:'Playfair Display',Georgia,serif;font-weight:900;font-size:19px;color:var(--gold-hi)}
  .wm span{color:var(--gold)}
  .sub{font-size:9px;letter-spacing:.28em;color:var(--gold-dim);font-weight:700;margin-top:2px}
  .pill{display:flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid #2A2013;border-radius:99px;
        background:#140F08;font-size:11px;font-weight:700;color:#C9BFA8}
  .dot{width:7px;height:7px;border-radius:99px;background:var(--ok)}
  .dot.stale{background:var(--warn)}
  .hero{background:linear-gradient(160deg,#1A1308,#0F0B06);border:1px solid #2F2415;border-radius:20px;padding:24px}
  .cap{font-size:10px;letter-spacing:.22em;color:var(--gold-dim);font-weight:700}
  .big{font-size:60px;font-weight:800;color:var(--gold-hi);line-height:1;letter-spacing:-.04em}
  .of{font-size:20px;font-weight:700;color:var(--muted2)}
  .bar{margin-top:18px;height:9px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar>div{height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold-hi));border-radius:99px;
           width:0;transition:width .6s cubic-bezier(.2,.7,.3,1)}
  .split{display:flex;justify-content:space-between;margin-top:9px;font-size:12px;color:var(--muted);font-weight:600}
  .tiles{display:flex;gap:10px;margin-top:12px}
  .tile{flex:1 1 0;background:var(--ink2);border:1px solid var(--line);border-radius:15px;padding:13px 14px;min-width:0}
  .tile b{display:block;font-size:9px;letter-spacing:.16em;color:#7A6B4A;font-weight:700}
  .tile i{display:block;font-style:normal;font-size:22px;font-weight:800;margin-top:4px;letter-spacing:-.02em}
  h2{font-size:14px;font-weight:800;margin:26px 0 12px}
  .hd{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px}
  .hd h2{margin:0}
  .hd span{font-size:11px;color:#7A6B4A;font-weight:600}
  .flow{display:flex;align-items:flex-end;justify-content:center;gap:4px;height:110px}
  .flow>div{flex:1 1 0;max-width:26px;background:var(--gold-dim);border-radius:3px 3px 0 0;min-height:3px;transition:height .5s}
  .flow>div.peak{background:var(--gold-hi)}
  .axis{display:flex;justify-content:space-between;margin-top:9px;font-size:11px;color:var(--muted2);font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
  .cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
        border-radius:9px;border:1px solid var(--line);background:var(--ink2)}
  .cell b{font-size:13px;font-weight:800;line-height:1;color:#C9BFA8}
  .cell i{font-style:normal;font-size:8px;font-weight:700;color:#5A5142}
  .cell.part{background:#1C1509;border-color:var(--line2)} .cell.part b{color:var(--gold-hi)} .cell.part i{color:#8A7A55}
  .cell.half{background:#3A2C17;border-color:var(--gold-dim)} .cell.half b{color:var(--gold-hi)} .cell.half i{color:#C9A227}
  .cell.full{background:var(--gold-hi);border-color:var(--gold-hi)} .cell.full b,.cell.full i{color:var(--ink)}
  .list{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);
        border-radius:14px;overflow:hidden}
  .li{display:flex;align-items:center;justify-content:space-between;background:var(--ink2);padding:13px 16px;gap:12px}
  .li .n{font-size:15px;font-weight:700}
  .li .m{font-size:11px;color:#7A6B4A;font-weight:600;margin-top:3px}
  .li .t{font-size:18px;font-weight:800;color:var(--gold-hi)}
  .gate{padding:60px 22px;max-width:420px;margin:0 auto;text-align:center}
  input{font-family:inherit;width:100%;background:#161009;border:1px solid #2F2415;color:var(--cream);
        border-radius:14px;padding:16px 17px;font-size:17px;font-weight:700;outline:none;text-align:center;letter-spacing:.2em}
  .btn{width:100%;padding:19px;border-radius:15px;border:none;background:var(--gold-hi);color:var(--ink);
       font-family:inherit;font-size:17px;font-weight:800;margin-top:11px;cursor:pointer}
  .empty{color:var(--muted);font-size:14px;font-weight:600;text-align:center;padding:22px 0}
</style>
</head>
<body>

<div id="gate" class="gate">
  <div class="wm" style="font-size:34px">Ojis <span>@</span> 50</div>
  <div class="sub" style="margin-bottom:26px">LIVE DASHBOARD</div>
  <input id="code" type="password" autocomplete="current-password" placeholder="PASSWORD" style="letter-spacing:.08em">
  <button class="btn" id="go">Open</button>
  <div id="err" style="color:var(--bad);font-size:13px;font-weight:700;margin-top:12px;min-height:18px"></div>
</div>

<div id="app" class="wrap" style="display:none">
  <div class="top">
    <div><div class="wm">Ojis <span>@</span> 50</div><div class="sub">LIVE</div></div>
    <div class="pill"><span class="dot" id="dot"></span><span id="clock">—</span></div>
  </div>

  <div class="hero">
    <div class="cap">GUESTS ARRIVED</div>
    <div style="display:flex;align-items:baseline;gap:9px;margin-top:8px">
      <div class="big" id="nArrived">—</div><div class="of" id="nTotal">/ 345</div>
    </div>
    <div class="bar"><div id="barFill"></div></div>
    <div class="split"><span id="pct">—</span><span id="nOut">—</span></div>
  </div>

  <div class="tiles">
    <div class="tile"><b>LAST 15 MIN</b><i id="tRate" style="color:var(--cream)">—</i></div>
    <div class="tile"><b>DUPLICATES</b><i id="tDup" style="color:var(--warn)">—</i></div>
    <div class="tile"><b>UNKNOWN</b><i id="tBad" style="color:var(--bad)">—</i></div>
  </div>

  <div class="hd"><h2>Arrivals</h2><span id="peakLbl">—</span></div>
  <div class="flow" id="flow"></div>
  <div class="axis" id="axis"></div>

  <div class="hd"><h2>Tables filling</h2><span id="fullLbl">—</span></div>
  <div class="grid" id="grid"></div>

  <h2>Just arrived</h2>
  <div class="list" id="recent"></div>
</div>

<script>
(function(){
"use strict";
const URL_="https://qaunsrwutckiovtkvuhm.supabase.co", KEY="sb_publishable_HTSqWtJRzIqbR81vWlLMNA_BcNqX5kd";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=iso=>{try{return new Date(iso).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}catch(e){return "—"}};
let code = localStorage.getItem("ojis.dash") || "", timer=null, lastOk=0;

async function rpc(fn,body){
  const r=await fetch(URL_+"/rest/v1/rpc/"+fn,{method:"POST",
    headers:{"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json"},
    body:JSON.stringify(body)});
  if(!r.ok) throw new Error("http "+r.status);
  return r.json();
}

async function refresh(){
  let d;
  try{ d = await rpc("ojis_dashboard",{p_event_code:code}); }
  catch(e){ paintStale(); return; }
  if(!d || d.result!=="OK"){ paintStale(); return; }
  lastOk=Date.now(); render(d);
}
function paintStale(){
  $("#dot").className = "dot stale";
  $("#clock").textContent = lastOk ? "stale" : "offline";
}

function render(d){
  const s=d.summary||{};
  const total=+s.total_guests||0, inn=+s.checked_in||0;
  $("#dot").className="dot";
  $("#clock").textContent=new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
  $("#nArrived").textContent=inn;
  $("#nTotal").textContent="/ "+total;
  const pct = total? Math.round(inn/total*100):0;
  $("#barFill").style.width=pct+"%";
  $("#pct").textContent=pct+"% checked in";
  $("#nOut").textContent=(total-inn)+" still out";
  $("#tDup").textContent=+s.duplicate_scans||0;
  $("#tBad").textContent=+s.failed_scans||0;

  // arrivals in the last 15 minutes, from the 5-minute buckets
  const flow=(d.flow||[]);
  const cut=Date.now()-15*60*1000;
  $("#tRate").textContent=flow.filter(f=>new Date(f.bucket).getTime()>=cut)
                              .reduce((a,f)=>a+(+f.arrivals||0),0);

  // flow chart — single hue, peak highlighted, no chartjunk
  const el=$("#flow"), ax=$("#axis");
  if(!flow.length){ el.innerHTML='<div style="flex:1;align-self:center;text-align:center;color:var(--muted2);font-size:13px;font-weight:600;background:none">No arrivals yet</div>'; ax.innerHTML=""; $("#peakLbl").textContent=""; }
  else{
    const show=flow.slice(-24), peak=Math.max.apply(null,show.map(f=>+f.arrivals||0))||1;
    el.innerHTML=show.map(f=>{
      const v=+f.arrivals||0, h=Math.max(3,Math.round(v/peak*104));
      return '<div class="'+(v===peak?"peak":"")+'" style="height:'+h+'px" title="'+v+'"></div>';
    }).join("");
    ax.innerHTML='<span>'+fmt(show[0].bucket)+'</span>'+
                 (show.length>2?'<span>'+fmt(show[Math.floor(show.length/2)].bucket)+'</span>':'')+
                 '<span>'+fmt(show[show.length-1].bucket)+'</span>';
    const pk=show.find(f=>(+f.arrivals||0)===peak);
    $("#peakLbl").textContent="peak "+peak+" at "+fmt(pk.bucket);
  }

  // table fill
  const tables=d.tables||[];
  $("#grid").innerHTML=tables.map(t=>{
    const seats=+t.seats||0, arr=+t.arrived||0, r=seats?arr/seats:0;
    const cls = r>=1?"full" : r>=.5?"half" : r>0?"part" : "";
    return '<div class="cell '+cls+'"><b>'+esc(t.table_number)+'</b><i>'+arr+'/'+seats+'</i></div>';
  }).join("");
  $("#fullLbl").textContent=tables.filter(t=>+t.arrived>=+t.seats && +t.seats>0).length+" full";

  // recent
  const rec=d.recent||[];
  $("#recent").innerHTML = rec.length
    ? rec.map(r=>'<div class="li"><div><div class="n">'+esc(r.guest_name)+'</div>'+
        '<div class="m">'+fmt(r.checked_in_at)+(r.checked_in_by?' · '+esc(r.checked_in_by):'')+'</div></div>'+
        '<div class="t">'+esc(r.table_number)+'</div></div>').join("")
    : '<div class="li"><div class="empty" style="width:100%">Nobody has checked in yet.</div></div>';
}

function start(){
  $("#gate").style.display="none"; $("#app").style.display="block";
  refresh(); clearInterval(timer); timer=setInterval(refresh,10000);
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) refresh(); });
}
$("#go").onclick=async()=>{
  const pw=$("#code").value; if(!pw){ $("#err").textContent="Enter the password."; return; }
  $("#err").textContent="Checking…";
  try{
    const u=await rpc("ojis_unlock",{p_password:pw});
    if(!u || u.result==="DENIED"){ $("#err").textContent="That password isn't right."; return; }
    if(u.result==="LOCKED_OUT"){ $("#err").textContent="Too many wrong attempts. Wait five minutes."; return; }
    code=u.event_code; localStorage.setItem("ojis.dash",code);
    $("#err").textContent=""; $("#code").value=""; start();
  }catch(e){ $("#err").textContent="Couldn't connect. Check your signal."; }
};
$("#code").addEventListener("keydown",e=>{ if(e.key==="Enter") $("#go").click(); });
if(code){ start(); }
})();
</script>
</body>
</html>
